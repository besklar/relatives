name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: JVM tests, lint and APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android tests (API 36)
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: ./gradlew connectedDebugAndroidTest --console=plain
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          groups = {
              'JVM': Path('app/build/test-results/testDebugUnitTest'),
              'Android': Path('app/build/outputs/androidTest-results/connected'),
          }
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Test results\n\n| Suite | Passed | Failed/errors | Skipped |\n| --- | ---: | ---: | ---: |\n')
              for name, directory in groups.items():
                  reports = list(directory.rglob('TEST-*.xml'))
                  if not reports:
                      summary.write(f'| {name} | No results produced | — | — |\n')
                      continue
                  tests = failures = skipped = 0
                  for report in reports:
                      root = ET.parse(report).getroot()
                      suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
                      for suite in suites:
                          tests += int(suite.get('tests', 0))
                          failures += int(suite.get('failures', 0)) + int(suite.get('errors', 0))
                          skipped += int(suite.get('skipped', 0))
                  summary.write(f'| {name} | {tests - failures - skipped} | {failures} | {skipped} |\n')
              summary.write('\nDownload the verification reports artifact for test and lint details.\n')
          PY
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
